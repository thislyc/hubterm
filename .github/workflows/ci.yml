name: CI
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install lrzsz (zmodem tests)
        run: brew install lrzsz
      - run: npm install
      - run: npm test

  build-macos:
    runs-on: macos-latest
    needs: test
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install lrzsz (assemble.sh re-runs zmodem tests)
        run: brew install lrzsz
      - run: npm install
      - name: Assemble app bundle (darwin-${{ matrix.arch }})
        env:
          HUBTERM_DEST: ${{ github.workspace }}/out/HubTerm.app
        run: sh scripts/assemble.sh ${{ matrix.arch }}
      - name: Zip app bundle
        run: |
          cd "$GITHUB_WORKSPACE/out"
          zip -qry "HubTerm-macOS-${{ matrix.arch }}.zip" HubTerm.app
      - uses: actions/upload-artifact@v4
        with:
          name: HubTerm-macOS-${{ matrix.arch }}
          path: out/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install lrzsz + zip (assemble-win.js re-runs zmodem tests)
        run: sudo apt-get update && sudo apt-get install -y lrzsz zip unzip
      - run: npm install
      - name: Assemble Windows x64
        run: node scripts/assemble-win.js
      - uses: actions/upload-artifact@v4
        with:
          name: HubTerm-win-x64
          path: dist/HubTerm-*-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: HubTerm-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
